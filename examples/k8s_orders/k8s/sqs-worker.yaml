# The SQS leg - a worker Deployment with no Service (nothing calls it; it calls out to SQS). No
# bundled SQS here: point both queue URLs at real ones - SQS_ENDPOINT_URL is left UNSET so boto3
# falls through to its default credential chain (an IRSA role on EKS, bound via serviceAccountName
# below). For a credential-free local run against LocalStack instead, see ../compose/docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-sqs-worker
  namespace: k8s-orders
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-sqs-worker }
  template:
    metadata:
      labels: { app: orders-sqs-worker }
    spec:
      # serviceAccountName: orders-sqs-worker   # bind this to an IRSA role with sqs:ReceiveMessage/
                                                 # DeleteMessage/SendMessage on the two queues below
      containers:
        - name: orders-sqs-worker
          image: orders-sqs-worker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: BENZENE_SQS_CONSUME_QUEUE_URL
              value: "https://sqs.eu-west-1.amazonaws.com/<account-id>/orders-in"        # <- replace
            - name: BENZENE_SQS_EVENTS_QUEUE_URL
              value: "https://sqs.eu-west-1.amazonaws.com/<account-id>/orders-events"    # <- replace

# One Deployment + Service for all three legs - HTTP, SQS, and Kafka all run in this one process
# (see ../app.py). No bundled SQS/Kafka here: point the queue/topic env vars at a real queue pair and
# cluster - SQS_ENDPOINT_URL is left UNSET so boto3 falls through to its default credential chain (an
# IRSA role on EKS, bound via serviceAccountName below). For a credential-free local run against
# LocalStack + a throwaway Kafka broker instead, see ../compose/docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-app
  namespace: k8s-orders
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders-app }
  template:
    metadata:
      labels: { app: orders-app }
    spec:
      # serviceAccountName: orders-app   # bind this to an IRSA role with sqs:ReceiveMessage/
                                          # DeleteMessage/SendMessage on the two queues below
      containers:
        - name: orders-app
          image: k8s-orders:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: BENZENE_ORDERS_EVENTS_URL, value: "http://events.example.internal" }   # <- replace
            - name: BENZENE_SQS_CONSUME_QUEUE_URL
              value: "https://sqs.eu-west-1.amazonaws.com/<account-id>/orders-in"        # <- replace
            - name: BENZENE_SQS_EVENTS_QUEUE_URL
              value: "https://sqs.eu-west-1.amazonaws.com/<account-id>/orders-events"    # <- replace
            - name: BENZENE_KAFKA_BOOTSTRAP
              value: "kafka-bootstrap.kafka.svc.cluster.local:9092"   # <- replace
            - { name: BENZENE_KAFKA_CONSUME_TOPIC, value: "orders-in" }
            - { name: BENZENE_KAFKA_TOPIC, value: "orders-events" }
            - { name: BENZENE_KAFKA_GROUP, value: "orders" }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders-app
  namespace: k8s-orders
spec:
  selector: { app: orders-app }
  ports: [{ port: 80, targetPort: 8080 }]

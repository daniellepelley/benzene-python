# This repo is a monorepo of several independently-publishable distributions under packages/
# (benzene-results, benzene-core, benzene-http, benzene-testing, plus per-cloud hosts like
# benzene-gcp), each sharing the `benzene` PEP 420 namespace so a developer installs only the layers
# they use. This root file is NOT a distribution — it only configures the dev/test tooling for the
# whole workspace, including the runnable examples under examples/.
#
# Local dev (no build needed — PEP 420 namespace packages resolve straight off sys.path):
#     pytest                       # uses the pythonpath below (packages + examples)
#     python -m tests.conformance_runner
#
# Or install the layers editable (what CI does, and what proves the packaging):
#     pip install -e packages/benzene-results -e packages/benzene-core -e packages/benzene-http \
#                  -e packages/benzene-testing -e packages/benzene-gcp

[tool.ruff]
# Lint the whole workspace (packages + runnable examples + tests) with one config.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A measured, high-signal rule set: pyflakes/pycodestyle errors, import sorting, modern-Python
# upgrades, and bugbear. Kept strict enough to catch real issues without fighting the house style.
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is enforced by the formatter's judgment, not a hard cap here
    "B008",   # calls in argument defaults are used deliberately (e.g. field(default_factory=...))
]

[tool.ruff.lint.per-file-ignores]
# Tests favour readability over some lint niceties.
"tests/**" = ["B011"]

[tool.mypy]
# Type-check the ten packages as one PEP 420 namespace. A pragmatic-but-rigorous bar: default checks
# plus the high-signal flags that catch real bugs (untyped-body checking, return-Any, redundant
# ignores, strict equality) without requiring exhaustive annotation of every internal helper.
python_version = "3.10"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true # third-party (grpcio, pydantic, cloud SDKs) ship without stubs
mypy_path = "packages/benzene-results:packages/benzene-core:packages/benzene-http:packages/benzene-grpc:packages/benzene-mesh:packages/benzene-pydantic:packages/benzene-testing:packages/benzene-gcp:packages/benzene-aws:packages/benzene-azure:deploy/mesh"
files = [
    "packages/benzene-results/benzene",
    "packages/benzene-core/benzene",
    "packages/benzene-http/benzene",
    "packages/benzene-grpc/benzene",
    "packages/benzene-mesh/benzene",
    "packages/benzene-pydantic/benzene",
    "packages/benzene-testing/benzene",
    "packages/benzene-gcp/benzene",
    "packages/benzene-aws/benzene",
    "packages/benzene-azure/benzene",
    "deploy/mesh/collector",
    "deploy/mesh/fleet",
]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
# warn_return_any is intentionally off: this is a framework that moves JSON across dynamic boundaries
# (json.loads, dict.get, type-erased casts), where "returns Any" is the honest shape, not a defect.

[[tool.mypy.overrides]]
# The gRPC package's optional-import fallback (grpcio may be absent) reuses class names as runtime
# stubs; whether each `# type: ignore` fires depends on whether grpcio is installed in the checking
# env, so pinning "unused ignore" there would be brittle across CI matrices.
module = "benzene.grpc"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests", "examples", "deploy/mesh/collector", "deploy/mesh/fleet"]
pythonpath = [
    "packages/benzene-results",
    "packages/benzene-core",
    "packages/benzene-grpc",
    "packages/benzene-http",
    "packages/benzene-mesh",
    "packages/benzene-pydantic",
    "packages/benzene-testing",
    "packages/benzene-gcp",
    "packages/benzene-aws",
    "packages/benzene-azure",
    "examples",
    "deploy/mesh",
]

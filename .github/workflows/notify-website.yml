name: Notify website

# Ships in benzene-python. On a push to main that touches the docs, fire a repository_dispatch at the
# benzene repo so its Deploy Website workflow rebuilds dev.benzene.app with the fresh Python docs. The
# deploy workflow already listens for the generic `port-docs-updated` event, so nothing changes there.
# Requires a repo secret WEBSITE_DISPATCH_TOKEN: a PAT (or fine-grained token) with "contents: read" +
# "actions: write" (repository_dispatch) on daniellepelley/Benzene. If the secret is absent the step is
# skipped, so this never hard-fails a docs push.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    # Map the secret to an env var: the `secrets` context is NOT available in an `if` conditional
    # (only in `env`/`with`/`run`), so guarding the step directly on `secrets.*` is a workflow-level
    # error that fails the whole run before any job starts. Bind it here, then gate on `env.*`.
    env:
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch website rebuild
        if: ${{ env.WEBSITE_DISPATCH_TOKEN != '' }}
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            https://api.github.com/repos/daniellepelley/Benzene/dispatches \
            -d '{"event_type":"port-docs-updated"}'

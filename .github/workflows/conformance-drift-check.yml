name: conformance-drift-check

# The language-neutral conformance fixtures are OWNED by the cross-language `benzene` repo
# (docs/specification/conformance/*.json). This repo carries a VENDORED snapshot under
# conformance/ so the test suite is self-contained with no submodule. This job keeps the
# snapshot honest: it fetches the canonical fixtures from benzene and fails if they differ.
#
# The check runs both ways on purpose. A vendored fixture that has drifted is the obvious half; a
# canonical fixture MISSING from the snapshot is the half that actually bites, because a runner
# cannot notice a fixture it was never given.
#
# What this job does NOT check is that a vendored fixture is ever actually OPENED by a runner —
# byte-identical and unrun looks exactly like byte-identical and green. That half lives in
# tests/conformance_runner.py's run_fixture_coverage().

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # weekly, catches drift introduced on the benzene side
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch canonical fixtures from benzene
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/daniellepelley/Benzene.git /tmp/benzene
          git -C /tmp/benzene sparse-checkout set docs/specification/conformance
          mkdir -p /tmp/canonical
          cp /tmp/benzene/docs/specification/conformance/*.json /tmp/canonical/
          cp /tmp/benzene/docs/specification/conformance/README.md /tmp/canonical/

      - name: Diff vendored snapshot against canonical
        run: |
          set -euo pipefail
          fail=0
          for f in conformance/*.json; do
            name=$(basename "$f")
            if [ ! -f "/tmp/canonical/$name" ]; then
              echo "::error file=$f::Vendored fixture $name no longer exists in benzene canonical"
              fail=1
              continue
            fi
            if ! diff -u "/tmp/canonical/$name" "$f" > /tmp/diff.txt; then
              echo "::error file=$f::Vendored fixture $name has drifted from benzene canonical"
              cat /tmp/diff.txt
              fail=1
            fi
          done
          for f in /tmp/canonical/*.json; do
            name=$(basename "$f")
            if [ ! -f "conformance/$name" ]; then
              echo "::error::Canonical fixture $name is missing from the vendored snapshot"
              fail=1
            fi
          done
          # The README is vendored too, and is not decoration: it is what says which fixtures are
          # *conditional* on a capability, which is the authority tests/conformance_runner.py's
          # UNRUN_FIXTURES cites for each fixture it deliberately does not run. A drifted copy of it
          # is a stale reason for skipping a check.
          if ! diff -u /tmp/canonical/README.md conformance/README.md > /tmp/diff.txt; then
            echo "::error file=conformance/README.md::Vendored conformance README has drifted from benzene canonical"
            cat /tmp/diff.txt
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Conformance fixtures have drifted from the canonical benzene spec."
            echo "Re-vendor: cp <benzene>/docs/specification/conformance/*.json <benzene>/docs/specification/conformance/README.md conformance/"
            echo "and update conformance/SPEC_VERSION to the new benzene commit."
            exit 1
          fi
          echo "vendored fixtures match canonical ($(ls conformance/*.json | wc -l) files)"

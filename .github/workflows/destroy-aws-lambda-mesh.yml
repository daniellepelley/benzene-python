# Tear down examples/aws_lambda_mesh — a dedicated, one-click counterpart to Deploy AWS Lambda Mesh
# Example. That workflow already bundles apply/plan/destroy into one dispatch input (this repo's own
# deploy-mesh.yml convention), but tearing the stack down means remembering to flip that dropdown.
# This workflow only ever destroys — running it with the defaults is enough, no typed confirmation
# phrase needed. Same "test" Environment credentials and the same per-account S3 state (key
# aws-lambda-mesh/) as the deploy workflow, so it tears down anything that workflow created.

name: Destroy AWS Lambda Mesh Example

on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region"
        type: string
        default: eu-west-1

permissions:
  contents: read

concurrency:
  group: deploy-aws-lambda-mesh
  cancel-in-progress: false

env:
  TF_DIR: examples/aws_lambda_mesh/deploy
  TF_IN_AUTOMATION: "1"

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: test

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ inputs.region }}
      AWS_DEFAULT_REGION: ${{ inputs.region }}

    steps:
      - name: Check the AWS credentials arrived from the test environment
        run: |
          missing=0
          [ -n "${AWS_ACCESS_KEY_ID}" ] || { echo "::error::vars.AWS_ACCESS_KEY_ID is empty — run Benzene's 'Sync Test Environment' into this repo first."; missing=1; }
          [ -n "${AWS_SECRET_ACCESS_KEY}" ] || { echo "::error::secrets.AWS_SECRET_ACCESS_KEY is empty — run Benzene's 'Sync Test Environment' into this repo first."; missing=1; }
          exit "${missing}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the service + mesh Lambda zips
        # Terraform's Lambda resources hash these files (filebase64sha256) even on a pure destroy, so
        # they must exist in this run regardless.
        run: |
          examples/aws_lambda_mesh/deploy/build_service.sh
          examples/aws_lambda_mesh/deploy/build_mesh.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5" # >= 1.10 for S3-native state locking (no DynamoDB table)
          terraform_wrapper: false

      - name: Who am I (fail early if the creds are wrong)
        run: aws sts get-caller-identity

      - name: Locate the Terraform state bucket
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          bucket="benzene-mesh-tfstate-${account}-${AWS_REGION}"
          if ! aws s3api head-bucket --bucket "${bucket}" 2>/dev/null; then
            echo "::notice::State bucket ${bucket} doesn't exist — nothing was ever deployed in this account/region, nothing to destroy."
            echo "SKIP_DESTROY=1" >> "$GITHUB_ENV"
          fi
          echo "TFSTATE_BUCKET=${bucket}" >> "$GITHUB_ENV"

      - name: Point Terraform at the S3 backend (CI only; committed config stays backend-less)
        if: env.SKIP_DESTROY != '1'
        run: |
          cat > "${TF_DIR}/backend_override.tf" <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: terraform init
        if: env.SKIP_DESTROY != '1'
        run: |
          terraform -chdir="${TF_DIR}" init -input=false \
            -backend-config="bucket=${TFSTATE_BUCKET}" \
            -backend-config="key=aws-lambda-mesh/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: terraform destroy
        if: env.SKIP_DESTROY != '1'
        run: terraform -chdir="${TF_DIR}" destroy -input=false -auto-approve -var="region=${AWS_REGION}"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-results"
version = "0.1.0b2"
description = "Benzene Result type and status vocabulary — the bottom layer of the Python Benzene port."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = ["benzene", "result", "status", "hexagonal", "message-handler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package: `benzene` has no __init__.py, so several distributions can each
# contribute a subpackage (benzene.results, benzene.core, benzene.http) to the shared namespace.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

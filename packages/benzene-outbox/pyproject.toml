[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-outbox"
version = "0.1.0b2"
description = "Benzene transactional outbox — stage a send with your state write, forward it afterwards, at-least-once."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = [
    "benzene",
    "outbox",
    "transactional-outbox",
    "store-and-forward",
    "dual-write",
    "at-least-once",
    "hexagonal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["benzene-core>=0.1.0b1"]

[project.optional-dependencies]
sql = ["sqlalchemy>=2.0"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

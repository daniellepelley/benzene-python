[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-resilience"
version = "0.1.0b2"
description = "Benzene resilience policies — circuit breaker, bulkhead, rate limiting, idempotency (in-memory, Redis and DynamoDB stores), and in-process sagas."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = [
    "benzene",
    "resilience",
    "circuit-breaker",
    "bulkhead",
    "rate-limiting",
    "idempotency",
    "redis",
    "dynamodb",
    "saga",
    "hexagonal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["benzene-core>=0.1.0b1"]

# The durable idempotency stores. Both SDKs are optional and imported lazily, so the engine — and
# every test — runs with neither installed; a store constructed without its extra raises an
# ImportError naming the one to install.
[project.optional-dependencies]
redis = ["redis>=5.0"]
dynamodb = ["boto3>=1.34"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-mesh"
version = "0.0.1"
description = "Benzene mesh module — ServiceDescriptor self-description, the benzene:mesh endpoint, per-invocation tracing, and collector feeds."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = ["benzene", "mesh", "service-descriptor", "tracing", "observability", "hexagonal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["benzene-core>=0.0.1"]

# The mesh **host** surface (benzene.mesh.host + benzene.mesh.aggregator) — the networked collector,
# the config-driven aggregator, and the ASGI UI server — additionally needs the HTTP binding. It is an
# opt-in extra so installing benzene-mesh for descriptors/tracing/collector never pulls in benzene-http;
# `pip install benzene-mesh[host]` turns the Mesh Host on. Mirrors benzene-grpc's `[transport]` extra.
[project.optional-dependencies]
host = ["benzene-http>=0.0.1"]

# The AWS enrichment sources (benzene.mesh.aws) — the X-Ray topology source and the CloudWatch usage
# source — need the AWS SDK for their real clients. Opt-in so installing benzene-mesh for
# descriptors/tracing/collector/emitter never pulls in boto3; `pip install benzene-mesh[aws]` turns the
# AWS sources on. Their Protocol seams keep benzene.mesh.aws importable (and unit-testable with fakes)
# without boto3 — only the thin Boto3*Client adapters import it. Mirrors benzene-aws's `[boto3]` extra.
aws = ["boto3>=1.26"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-auth"
version = "0.1.0b2"
description = "Benzene authentication middleware — Basic auth, JWT/OAuth2 bearer tokens with JWKS/OIDC key rotation, and an API Gateway custom authorizer adapter."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = [
    "benzene",
    "auth",
    "authentication",
    "basic-auth",
    "jwt",
    "jwks",
    "oidc",
    "oauth2",
    "bearer-token",
    "api-gateway",
    "hexagonal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["benzene-core>=0.1.0b1"]

[project.optional-dependencies]
# Only needed for the real JWT decode; the middleware and its tests need no PyJWT at all.
#   [jwt]  — PyJWT alone: enough for JwtValidator against an HMAC secret.
#   [jwks] — PyJWT with its crypto backend, which the asymmetric keys (RS256/ES256) a JWKS almost
#            always carries need; this is the extra for JwksValidator.
jwt = ["PyJWT>=2.0"]
jwks = ["PyJWT[crypto]>=2.0"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-grpc"
version = "0.1.0b2"
description = "Benzene gRPC status mapping — the Benzene<->gRPC StatusCode contract and the benzene-status trailer rule."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = ["benzene", "grpc", "status", "middleware", "hexagonal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["benzene-core>=0.1.0b1"]

[project.optional-dependencies]
# Only the server/client transport needs grpcio; the status mapping is dependency-free. grpcio-status
# brings the google.rpc messages (via googleapis-common-protos) the transport packs into the
# grpc-status-details-bin trailer for structured errors — wire-contracts.md 4.2. Both stay in the
# extra: benzene/grpc/status.py imports neither, and the details trailer degrades to "attach nothing,
# read nothing" if the protos are absent.
transport = ["grpcio>=1.60", "grpcio-status>=1.60"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

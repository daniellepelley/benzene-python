[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-grpc"
version = "0.0.1"
description = "Benzene gRPC status mapping — the Benzene<->gRPC StatusCode contract and the benzene-status trailer rule."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = ["benzene", "grpc", "status", "middleware", "hexagonal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["benzene-core>=0.0.1"]

[project.optional-dependencies]
# Only the server/client transport needs grpcio; the status mapping is dependency-free.
transport = ["grpcio>=1.60"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

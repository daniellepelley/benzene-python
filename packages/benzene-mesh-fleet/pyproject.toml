[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-mesh-fleet"
version = "0.1.0b1"
description = "Benzene mesh fleet — cloud service-discovery adapters (AWS/Azure/Kubernetes) and trace-mappers (Jaeger/Tempo/X-Ray)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = [
    "benzene",
    "mesh",
    "service-discovery",
    "tracing",
    "jaeger",
    "tempo",
    "xray",
    "observability",
    "hexagonal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["benzene-core>=0.0.1", "benzene-mesh>=0.0.1"]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
azure = ["azure-identity>=1.14"]
kubernetes = ["kubernetes>=27.0"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

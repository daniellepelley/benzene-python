[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-http"
version = "0.1.0b2"
description = "Benzene inbound HTTP (ASGI) transport binding — host your handlers over HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = ["benzene", "http", "asgi", "middleware", "hexagonal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["benzene-core>=0.1.0b1"]

[project.optional-dependencies]
# Only needed by benzene.http.uvicorn_worker (serving HTTP as one leg of a WorkerHost). The
# binding itself is a plain ASGI app and requires no server: "uvicorn my_service:app" works with
# uvicorn installed however you like, and benzene.http.asgi_server_worker takes any server object.
uvicorn = ["uvicorn>=0.27"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

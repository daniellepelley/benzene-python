[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-gcp"
version = "0.1.0b1"
description = "Benzene Google Cloud Functions host — HTTP + Pub/Sub transport bindings and a Pub/Sub outbound client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = ["benzene", "gcp", "google-cloud", "cloud-functions", "pubsub", "hexagonal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["benzene-core>=0.1.0b1", "benzene-http>=0.1.0b1"]

[project.optional-dependencies]
# Only needed for the real Pub/Sub outbound client; inbound bindings + tests need no cloud SDK.
pubsub = ["google-cloud-pubsub>=2.0"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

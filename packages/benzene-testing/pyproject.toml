[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-testing"
version = "0.0.1"
description = "In-memory test host and test doubles for testing Benzene applications (dogfooded by the examples)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Benzene" }]
keywords = ["benzene", "testing", "test-helpers", "hexagonal"]
dependencies = ["benzene-core", "benzene-results"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]

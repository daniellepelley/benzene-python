[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benzene-testing"
version = "0.1.0b1"
description = "In-memory test host and test doubles for testing Benzene applications (dogfooded by the examples)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benzene" }]
keywords = ["benzene", "testing", "test-helpers", "hexagonal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["benzene-core>=0.1.0b1", "benzene-results>=0.1.0b1"]

[project.urls]
Homepage = "https://github.com/daniellepelley/benzene-python"
Specification = "https://github.com/daniellepelley/Benzene/tree/main/docs/specification"

# PEP 420 namespace package — see benzene-results/pyproject.toml.
[tool.hatch.build.targets.wheel]
packages = ["benzene"]
